[package]
name = "codemux"
version = "0.1.7"
description = "CodeMUX - AI 编码工具聚合平台"
authors = ["you"]
edition = "2021"

[lib]
name = "codemux_lib"
crate-type = ["lib", "cdylib", "staticlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-shell = "2"
tauri-plugin-dialog = "2"
tauri-plugin-notification = "2"
tauri-plugin-process = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-updater = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.31", features = ["bundled"] }
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4", "serde"] }
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", features = ["json", "stream"] }
toml_edit = "0.22"
futures = "0.3"
tauri-plugin-log = "2.8.0"
log = "0.4"
async-trait = "0.1"
portable-pty = "0.8"
encoding_rs = "0.8"
sha2 = "0.10"
dirs = "5"
tracing = { version = "0.1", optional = true }
tracing-subscriber = { version = "0.3", optional = true, features = ["env-filter"] }
tracing-log = { version = "0.2", optional = true }
console-subscriber = { version = "0.5", optional = true }

[target.'cfg(windows)'.dependencies]
junction = "1"
tauri-winrt-notification = "0.7.3"
windows-sys = { version = "0.61", features = ["Win32_Security", "Win32_Security_Authorization", "Win32_Storage_FileSystem", "Win32_System_Threading", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }
winreg = "0.52"

[features]
default = []
tokio-console = ["tokio/tracing", "dep:console-subscriber", "dep:tracing", "dep:tracing-subscriber", "dep:tracing-log"]
cmd-tracing = ["dep:tracing", "dep:tracing-subscriber"]
