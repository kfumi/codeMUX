[package]
name = "codemux"
version = "0.4.9"
description = "CodeMUX - AI 编码工具聚合平台(daemon)"
authors = ["you"]
edition = "2021"

[lib]
name = "codemux_lib"
crate-type = ["lib"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.31", features = ["bundled"] }
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4", "serde"] }
tokio = { version = "1", features = ["full"] }
socket2 = "0.5"
reqwest = { version = "0.12", features = ["json", "stream"] }
toml_edit = "0.22"
futures = "0.3"
log = { version = "0.4", features = ["std"] }
async-trait = "0.1"
portable-pty = "0.8"
encoding_rs = "0.8"
sha2 = "0.10"
hex = "0.4"
rand = "0.8"
axum = { version = "0.8", features = ["ws"] }
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.6", features = ["fs", "cors", "trace", "set-header"] }
local-ip-address = "0.6"
tokio-tungstenite = { version = "0.26", features = ["native-tls"] }
futures-util = "0.3"
base64 = "0.22"
sodiumoxide = "0.2"
dirs = "5"
tempfile = "3"
tracing = { version = "0.1", optional = true }
tracing-subscriber = { version = "0.3", optional = true, features = ["env-filter"] }
tracing-log = { version = "0.2", optional = true }
console-subscriber = { version = "0.5", optional = true }
keyring = { version = "4.1.6", features = ["windows-native-keyring-store"] }
similar = "2.7"

[target.'cfg(windows)'.dependencies]
junction = "1"
windows-sys = { version = "0.61", features = ["Win32_Storage_FileSystem"] }

[features]
default = []
tokio-console = ["tokio/tracing", "dep:console-subscriber", "dep:tracing", "dep:tracing-subscriber", "dep:tracing-log"]
cmd-tracing = ["dep:tracing", "dep:tracing-subscriber"]

[dev-dependencies]
rand = "0.8"
