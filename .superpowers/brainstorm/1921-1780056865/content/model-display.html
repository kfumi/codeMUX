<h2>对话框模型展示</h2>
<p class="subtitle">只读展示当前供应商的默认模型，不可切换</p>

<div class="options">
  <div class="option" data-choice="a" onclick="toggleSelect(this)">
    <div class="letter">A</div>
    <div class="content">
      <h3>输入框左侧标签</h3>
      <p>在输入框左侧显示供应商名+模型名，紧凑不占空间</p>
    </div>
  </div>
  <div class="option" data-choice="b" onclick="toggleSelect(this)">
    <div class="letter">B</div>
    <div class="content">
      <h3>输入框上方信息栏</h3>
      <p>输入框上方一行显示当前供应商和模型，更醒目</p>
    </div>
  </div>
</div>
