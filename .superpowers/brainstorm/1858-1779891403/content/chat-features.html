<h2>对话界面核心功能</h2>
<p class="subtitle">选择你需要的核心功能（可多选）</p>

<div class="options" data-multiselect>
  <div class="option" data-choice="a" onclick="toggleSelect(this)">
    <div class="letter">A</div>
    <div class="content">
      <h3>基础对话</h3>
      <p><strong>功能：</strong>消息发送/接收、Markdown渲染、代码高亮</p>
      <p><strong>重要性：</strong>核心功能，必须实现</p>
    </div>
  </div>

  <div class="option" data-choice="b" onclick="toggleSelect(this)">
    <div class="letter">B</div>
    <div class="content">
      <h3>会话管理</h3>
      <p><strong>功能：</strong>多会话切换、历史记录、会话重命名</p>
      <p><strong>重要性：</strong>提升使用效率</p>
    </div>
  </div>

  <div class="option" data-choice="c" onclick="toggleSelect(this)">
    <div class="letter">C</div>
    <div class="content">
      <h3>工具调用可视化</h3>
      <p><strong>功能：</strong>显示AI调用的工具、参数、结果</p>
      <p><strong>重要性：</strong>透明化AI行为，便于调试</p>
    </div>
  </div>

  <div class="option" data-choice="d" onclick="toggleSelect(this)">
    <div class="letter">D</div>
    <div class="content">
      <h3>文件操作集成</h3>
      <p><strong>功能：</strong>文件上传/下载、代码文件预览、差异对比</p>
      <p><strong>重要性：</strong>编码工具的核心需求</p>
    </div>
  </div>
</div>
