<h2>主题和外观</h2>
<p class="subtitle">应用的视觉风格和定制能力</p>

<div class="options">
  <div class="option" data-choice="a" onclick="toggleSelect(this)">
    <div class="letter">A</div>
    <div class="content">
      <h3>固定主题（亮色+暗色）</h3>
      <p><strong>方式：</strong>提供亮色和暗色两种主题，用户选择</p>
      <p><strong>优势：</strong>开发简单，维护成本低</p>
      <p><strong>劣势：</strong>定制性有限</p>
      <p><strong>适合：</strong>追求简洁，不需要高度定制</p>
    </div>
  </div>

  <div class="option" data-choice="b" onclick="toggleSelect(this)">
    <div class="letter">B</div>
    <div class="content">
      <h3>主题系统</h3>
      <p><strong>方式：</strong>支持多种预设主题，可自定义颜色</p>
      <p><strong>优势：</strong>个性化程度高，用户体验好</p>
      <p><strong>劣势：</strong>开发工作量大，需要设计主题配置</p>
      <p><strong>适合：</strong>注重用户体验和个性化</p>
    </div>
  </div>

  <div class="option" data-choice="c" onclick="toggleSelect(this)">
    <div class="letter">C</div>
    <div class="content">
      <h3>CSS变量 + 用户自定义</h3>
      <p><strong>方式：</strong>使用CSS变量，支持用户导入自定义主题</p>
      <p><strong>优势：</strong>灵活性极高，社区可贡献主题</p>
      <p><strong>劣势：</strong>需要文档支持，学习成本</p>
      <p><strong>适合：</strong>技术用户，喜欢定制</p>
    </div>
  </div>
</div>
