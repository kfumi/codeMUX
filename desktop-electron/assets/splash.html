<!doctype html>
<!-- 启动 splash(方案 A):纯 HTML/CSS,零脚本 —— app ready 后数毫秒内即可绘制,
     盖住渲染层 bundle 解析 + daemon 冷启动的黑屏窗口期。
     背景与主窗口 backgroundColor(#111111,对齐主题暗色 --background)一致,
     转场无跳色;动画尊重系统「减少动态效果」设置(降级为静态 logo)。 -->
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <title>CodeMUX</title>
    <style>
      html,
      body {
        margin: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #111111;
        /* 无边框窗口支持拖拽(打包态无系统标题栏)。 */
        -webkit-app-region: drag;
        user-select: none;
      }

      .stage {
        width: 100%;
        height: 100%;
        display: flex;
        align-items: center;
        justify-content: center;
      }

      .logo {
        width: 96px;
        height: 96px;
        -webkit-app-region: no-drag;
      }

      /* 扫光层:叠在 logo 上,一道斜向高光周期性掠过。
         mask-image 取 logo 形状(alpha 通道),扫光只在 logo 图形内可见;
         呼吸保留在外层(轻微透明度 + 缩放),与扫光节奏错开不打架。 */
      .logo-wrap {
        position: relative;
        width: 96px;
        height: 96px;
        -webkit-app-region: no-drag;
        animation: breathe 3s ease-in-out infinite;
      }

      @keyframes breathe {
        0%,
        100% {
          opacity: 0.85;
          transform: scale(1);
        }
        50% {
          opacity: 1;
          transform: scale(1.03);
        }
      }

      .logo-wrap .logo {
        position: absolute;
        inset: 0;
      }

      /* 扫光:外层 .sweep 固定不动、带 logo 形状蒙版(mask 会同时裁剪子元素),
         内层 .sweep-bar 是 3 倍宽的渐变光带,仅做 translateX 位移。
         不用 background-position 动画 —— 它每帧触发重绘,首启高负载(daemon
         冷启动抢 CPU)下容易掉帧,观感是「扫两下卡一下」;transform 位移
         由合成器执行,加载再忙也顺滑。 */
      .sweep {
        position: absolute;
        inset: 0;
        overflow: hidden;
        -webkit-mask-image: url('./icon.png');
        mask-image: url('./icon.png');
        -webkit-mask-size: cover;
        mask-size: cover;
        pointer-events: none;
      }

      .sweep-bar {
        position: absolute;
        top: 0;
        left: -100%; /* 光带宽 300%,居中铺满容器,高光停在 logo 之外。 */
        width: 300%;
        height: 100%;
        background: linear-gradient(
          115deg,
          transparent 40%,
          rgba(255, 255, 255, 0.16) 47%,
          rgba(255, 255, 255, 0.3) 50%,
          rgba(255, 255, 255, 0.16) 53%,
          transparent 60%
        );
        /* 匀速(linear)无缝循环:位移跨度 = 光带全宽,光带移出的瞬间又从
           右侧原位出现,视觉上是「光带匀速地一遍遍扫过 logo」,无停顿、
           无速度突变。transform 动画走合成器,首启高负载下也不掉帧。 */
        animation: sweep 3.2s linear infinite;
        will-change: transform;
      }

      @keyframes sweep {
        from {
          transform: translateX(66.7%); /* 66.7% × 300% ≈ 光带右缘进容器右缘。 */
        }
        to {
          transform: translateX(-66.7%);
        }
      }

      /* 系统「减少动态效果」:退化为静态 logo,不闪动、不扫光。 */
      @media (prefers-reduced-motion: reduce) {
        .logo,
        .logo-wrap {
          animation: none;
          opacity: 0.9;
        }
        .sweep-bar {
          animation: none;
          visibility: hidden;
        }
      }
    </style>
  </head>
  <body>
    <div class="stage">
      <div class="logo-wrap">
        <img class="logo" src="./icon.png" alt="" draggable="false" />
        <div class="sweep"><div class="sweep-bar"></div></div>
      </div>
    </div>
  </body>
</html>
