# CodeMUX Electron 壳打包配置(工单 06:可产出 NSIS 安装包;正式打包形态工单 09 收口)。
# 出包流程(根脚本 build:electron-installer):
#   npm run build          (仓库根,产出 dist/ 渲染层)
#   cd src-tauri && cargo build --release --bin codemux-daemon
#   之后根脚本构建 main(tsc)→ scripts/copy-renderer-dist.mjs 把 ../dist 拷入
#   renderer-dist/ → electron-builder --win nsis。
appId: com.codemux.desktop
productName: CodeMUX
# GitHub Releases(工单 06):electron-updater 的 feed 源 —— electron-builder 打包时
# 生成 resources/app-update.yml,运行时 autoUpdater 自动读取;owner/repo 反推自
# src-tauri/tauri.conf.json 的 updater endpoint(github.com/kfumi/codeMUX)。
publish:
  provider: github
  owner: kfumi
  repo: codeMUX
directories:
  output: release
  buildResources: build
files:
  - dist-electron/**
  # 渲染层随包分发(工单 06;打包前由 scripts/copy-renderer-dist.mjs 从仓库根
  # dist/ 拷入 —— 与工单 09 的资源根收口不冲突,届时只调整来源/布局)。
  - renderer-dist/**
  - package.json
extraResources:
  # daemon 独立二进制(工单 03)→ 资源根 daemon/
  - from: ../src-tauri/target/release/codemux-daemon.exe
    to: daemon/codemux-daemon.exe
  # 托盘/应用图标
  - from: ../src-tauri/icons/icon.ico
    to: icons/icon.ico
win:
  target:
    - target: nsis
      arch:
        - x64
  # 通知身份(工单 06):electron-builder 的 NSIS 快捷方式 AUMID 由 appId 派生,
  # 与 main.ts 的 app.setAppUserModelId('com.codemux.desktop') 一致 → 通知在
  # 通知中心归组到 CodeMUX,点击回跳应用。
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  shortcutName: CodeMUX
