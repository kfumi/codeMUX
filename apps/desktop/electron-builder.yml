# CodeMUX Electron 壳打包配置(NSIS 安装包)。
# 出包流程(根脚本 build:electron-installer,一条命令完成):
#   npm run build:daemon:release  (产出 daemon release 二进制)
#   npm run build:web             (仓库根,产出 dist/ 渲染层)
#   之后根脚本构建 main(tsc)→ scripts/copy-renderer-dist.mjs 把 ../../dist 拷入
#   renderer-dist/ → scripts/copy-sidecar-dist.mjs 把 ../../apps/sidecar/dist 拷入
#   sidecar-dist/ → electron-builder --win nsis。
# 签名:配置 CSC_LINK/CSC_KEY_PASSWORD 后 electron-builder 自动签应用本体;
# extraResources 的 daemon 二进制经下方 afterPack 钩子补签(见
# scripts/sign-daemon.cjs 与 docs/guides/desktop-release-guide.md)。
# 依赖里没有原生模块(electron-updater/ws 都是纯 JS),这步本来就是空跑;
# 而 electron-builder 26 起,它背后的 @electron/rebuild@4 要求 Node >= 22.12,
# 关掉可让出包在 Node 20 环境(CI/同事机器)上也能跑。
npmRebuild: false
appId: com.codemux.desktop
productName: CodeMUX
# GitHub Releases(工单 06):electron-updater 的 feed 源 —— electron-builder 打包时
# 生成 resources/app-update.yml,运行时 autoUpdater 自动读取;owner/repo 反推自
# (历史:原 Tauri updater endpoint 为 github.com/kfumi/codeMUX)。
publish:
  provider: github
  owner: kfumi
  repo: codeMUX
# daemon 二进制签名钩子(应用本体由 electron-builder 原生签名)。
afterPack: scripts/sign-daemon.cjs
directories:
  output: release
  buildResources: build
files:
  - dist-electron/**
  # 渲染层随包分发(工单 06;打包前由 scripts/copy-renderer-dist.mjs 从仓库根
  # dist/ 拷入 —— 与工单 09 的资源根收口不冲突,届时只调整来源/布局)。
  - renderer-dist/**
  - package.json
extraResources:
  # daemon 独立二进制(工单 03)→ 资源根 daemon/。不能直接写
  # target/release/codemux-daemon.exe:文件名随平台变(unix 不带 .exe),而
  # electron-builder.yml 没有按目标平台分支的能力。改由
  # scripts/stage-daemon-bin.mjs 先按当前平台把二进制放进 daemon-bin/,这里只
  # 引用目录名,一份配置通吃 win/mac/linux。落地文件名与 main.ts 的
  # resolveDaemonExe() 对应。
  - from: daemon-bin
    to: daemon
  # 统一前端产物(工单 02):daemon 经资源根 dist-web 把它服务给浏览器/移动形态,
  # 与壳内 renderer-dist 同源同一次构建(npm run build:web)。
  - from: ../../dist-web
    to: dist-web
  # agent sidecar:daemon 按资源根相对路径 sidecar/dist/index.js 拉起
  # (crates/daemon/src/agent/mod.rs)。sidecar-dist/ 由 scripts/copy-sidecar-dist.mjs
  # 在打包前生成 —— 含 dist/(tsc 产物)与仅标记 ESM 的 package.json,
  # 不含 node_modules(sidecar 运行时从托管 Runtime 目录加载 SDK)。
  - from: sidecar-dist
    to: sidecar
  # 托盘/应用图标
  - from: build/icons/icon.ico
    to: icons/icon.ico
  # 通知身份图标:通知归属区(应用名左侧)小图标;由 main.ts 写入
  # HKCU\Software\Classes\AppUserModelId\com.codemux.desktop 的 IconUri。
  - from: build/icons/Square150x150Logo.png
    to: icons/Square150x150Logo.png
win:
  # 应用/安装包/桌面快捷方式图标(≥256×256)。extraResources 里的图标只服务运行时/托盘。
  icon: build/icons/icon.ico
  target:
    - target: nsis
      arch:
        - x64
  # 通知身份(工单 06):electron-builder 的 NSIS 快捷方式 AUMID 由 appId 派生,
  # 与 main.ts 的 app.setAppUserModelId('com.codemux.desktop') 一致 → 通知在
  # 通知中心归组到 CodeMUX,点击回跳应用。
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  shortcutName: CodeMUX
  # artifactName 必须钉死成**无空格**的名字(v0.4.3~v0.4.6 的自动更新在 Windows
  # 上一直是坏的,根因就在这里):
  #   1. electron-builder 的 NSIS 默认产物名是 `CodeMUX Setup 0.4.6.exe`(带空格)。
  #   2. 写 latest.yml 时 computeSafeArtifactNameIfNeeded 会把空格换成短横,
  #      于是 latest.yml 里记的是 `CodeMUX-Setup-0.4.6.exe`;
  #      而磁盘上的文件仍叫 `CodeMUX Setup 0.4.6.exe`,**electron-builder 不会
  #      重命名它**。
  #   3. `gh release upload` 上传后,GitHub 把资产名里的空格替换成点,
  #      Release 上实际存的是 `CodeMUX.Setup.0.4.6.exe`。
  #   → latest.yml 指向的 URL 404,已装用户「检测得到新版本、点下载就失败」,
  #     而失败路径全程静默(见 updater.ts 的 updater.log 补齐前)。
  # 这里直接给一个 GitHub 安全名:磁盘名、latest.yml 的 url、Release 资产名三者一致。
  artifactName: ${productName}-Setup-${version}.${ext}

# macOS:dmg 给人装/分发,zip 给 electron-updater —— latest-mac.yml 指向的是 zip,
# 只出 dmg 的话已装用户检测得到新版本却装不上。两个产物都要。
#
# identity: null 是**明确的既定选择**,不是默认值碰运气:本项目拿不到、也不打算申请
# Apple Developer ID(年费 + 需实体组织),因此不做 Developer ID 签名与公证。
# electron-builder 会走 ad-hoc 签名(codesign -s -),产物能正常运行,代价是首启被
# Gatekeeper 拦一次:用户需右键点「打开」,或
#   xattr -dr com.apple.quarantine /Applications/CodeMUX.app
# 这条限制是 Apple 的策略,任何未公证的 mac 应用都一样,改不了。
# 安装说明写在 Release 说明正文里(见 .github/workflows/release.yml 的 createRelease)。
mac:
  icon: build/icons/icon.icns
  category: public.app-category.developer-tools
  identity: null
  target:
    - target: dmg
      arch:
        - x64
        - arm64
    - target: zip
      arch:
        - x64
        - arm64
# Linux:AppImage 单文件免 root,是最省事的分发形态;extraResources 的
# icons/icon.ico 在这里用不到(托盘走 PNG),保留无害。
linux:
  # executableName 必须显式指定:Linux 的可执行文件名默认取 package.json 的
  # name,而这里是作用域包名「@codemux/desktop」—— electron-builder 清洗后得到
  # 「@codemuxdesktop」,其中的 @ 在 AppImage 路径里非法,构建会直接失败:
  #   failed to build AppImage error=executableName contains characters that
  #   cannot be safely used in file paths: @codemuxdesktop
  # win/macOS 从 productName 取名,不受影响,所以只有 Linux 踩得到这个坑。
  executableName: CodeMUX
  icon: build/icons/icon.png
  category: Development
  target:
    - target: AppImage
      arch:
        - x64
