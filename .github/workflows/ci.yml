name: CI

on:
  push:
    # 仓库默认分支是 master(远端 HEAD 已确认);原配置的 main 导致 push 从不触发 CI。
    branches: [master]
  pull_request:
    branches: [master]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint & Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install frontend dependencies
        run: npm ci

      - name: Install sidecar dependencies
        working-directory: apps/sidecar
        run: npm ci

      - name: TypeScript type check
        run: npm run build

      - name: Build unified web bundle
        run: npm run build:web

      - name: Build sidecar
        working-directory: apps/sidecar
        run: npm run build

  test:
    name: Vitest
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install frontend dependencies
        run: npm ci

      - name: Install sidecar dependencies
        working-directory: apps/sidecar
        run: npm ci

      - name: Vitest (frontend)
        run: npm run test

      - name: Vitest (sidecar)
        run: npm run test:sidecar

  rust-check:
    name: Rust Check (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: crates/daemon

      - name: Install system dependencies (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          # daemon 是纯 Rust(axum/rusqlite/portable-pty),无 WebKit/托盘等
          # Tauri 时代依赖;openssl-sys 走 libssl-dev,sodium 由 libsodium-sys 内置源码编译。
          sudo apt-get install -y build-essential libssl-dev pkg-config

      - name: Rust fmt check
        working-directory: crates/daemon
        run: cargo fmt --all -- --check

      - name: Clippy
        working-directory: crates/daemon
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Rust build check
        working-directory: crates/daemon
        run: cargo check --all-targets --all-features

      - name: Rust tests
        working-directory: crates/daemon
        run: cargo test --all-features

  build:
    name: Build (${{ matrix.os }})
    needs: [lint, rust-check, test]
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: crates/daemon

      - name: Install system dependencies (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          # daemon 是纯 Rust(axum/rusqlite/portable-pty),无 WebKit/托盘等
          # Tauri 时代依赖;openssl-sys 走 libssl-dev,sodium 由 libsodium-sys 内置源码编译。
          sudo apt-get install -y build-essential libssl-dev pkg-config

      - name: Install frontend dependencies
        run: npm ci

      - name: Install sidecar dependencies
        working-directory: apps/sidecar
        run: npm ci

      - name: Build sidecar
        working-directory: apps/sidecar
        run: npm run build

      - name: Build unified web bundle
        run: npm run build:web

      - name: Build renderer
        run: npm run build
