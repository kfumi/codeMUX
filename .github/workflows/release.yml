name: Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  ensure-release:
    name: Ensure Release
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
      target_branch: ${{ steps.ensure.outputs.target_branch }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Resolve release version
        id: version
        shell: bash
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"

      - name: Ensure public release exists
        id: ensure
        uses: actions/github-script@v7
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
        with:
          github-token: ${{ github.token }}
          script: |
            const owner = "kfumi";
            const repo = "codeMUX";
            const tag = process.env.RELEASE_TAG;
            const version = process.env.RELEASE_VERSION;
            const repository = await github.rest.repos.get({ owner, repo });
            const targetBranch = repository.data.default_branch;
            core.info(`目标仓库默认分支: ${targetBranch}`);
            core.setOutput("target_branch", targetBranch);

            let releaseExists = false;

            try {
              const existing = await github.rest.repos.getReleaseByTag({
                owner,
                repo,
                tag,
              });
              releaseExists = true;
              core.info(`Release ${tag} 已存在，跳过创建。`);
              core.info(`Release id: ${existing.data.id}`);
            } catch (error) {
              if (error.status !== 404) {
                throw error;
              }

              let tagExists = true;
              try {
                await github.rest.git.getRef({
                  owner,
                  repo,
                  ref: `tags/${tag}`,
                });
                core.info(`Tag ${tag} 已存在，继续创建 Release。`);
              } catch (tagError) {
                if (tagError.status !== 404) {
                  throw tagError;
                }
                tagExists = false;
              }

              if (!tagExists) {
                const branchRef = await github.rest.git.getRef({
                  owner,
                  repo,
                  ref: `heads/${targetBranch}`,
                });

                await github.rest.git.createRef({
                  owner,
                  repo,
                  ref: `refs/tags/${tag}`,
                  sha: branchRef.data.object.sha,
                });

                core.info(`已创建 Tag ${tag} -> ${branchRef.data.object.sha}`);
              }

              const created = await github.rest.repos.createRelease({
                owner,
                repo,
                tag_name: tag,
                name: `codeMUX v${version}`,
                body: "桌面端安装包下载见下方 Assets。",
                draft: false,
                prerelease: false,
                target_commitish: targetBranch,
              });

              core.info(`已创建 Release ${tag}，id: ${created.data.id}`);
            }

  # Tauri 时代这里是 publish-tauri(tauri-action 一步出包并附到 Release)。
  # 迁移到 Electron 壳后该 job 被删掉,只剩 ensure-release 建记录、不出包 ——
  # 于是推 tag 只能得到一个空 Assets 的 Release。本 job 补回出包与上传:
  # 出包(Windows NSIS,与本地 build:electron-installer 同链路)→ upload-artifact
  # 留存 → gh release upload 附到 ensure-release 建的 Release 上。
  build-windows:
    name: Build Windows Installer
    needs: ensure-release
    runs-on: windows-latest
    env:
      TAG_NAME: ${{ needs.ensure-release.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          # 按 tag 而非触发 ref 取代码:workflow_dispatch 时 tag 可能刚由
          # ensure-release 创建,或与分支头有偏差,出包必须对齐 tag 指向的提交。
          ref: ${{ needs.ensure-release.outputs.tag }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            package-lock.json
            apps/sidecar/package-lock.json
            apps/desktop/package-lock.json

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: crates/daemon

      - name: Cache electron-builder binaries
        uses: actions/cache@v4
        with:
          # nsis / nsis-resources / 7zip / winCodeSign 等工具包约 100MB+,
          # 缓存后免去每次重新下载(国内网络下这步尤其容易超时)。
          path: ~\AppData\Local\electron-builder\Cache
          key: electron-builder-${{ runner.os }}-${{ hashFiles('apps/desktop/package-lock.json') }}
          restore-keys: |
            electron-builder-${{ runner.os }}-

      - name: Configure code signing
        shell: pwsh
        env:
          # secrets 上下文不能直接用于 if 条件,故先入环境变量再判断。
          CSC_LINK_SECRET: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD_SECRET: ${{ secrets.CSC_KEY_PASSWORD }}
        run: |
          if ($env:CSC_LINK_SECRET) {
            "CSC_LINK=$env:CSC_LINK_SECRET" >> $env:GITHUB_ENV
            "CSC_KEY_PASSWORD=$env:CSC_KEY_PASSWORD_SECRET" >> $env:GITHUB_ENV
            Write-Host "已注入签名证书,本次出包将签名(应用本体 + daemon)。"
          } else {
            Write-Host "未配置 secrets.CSC_LINK,本次出包为未签名产物。"
            "未配置 secrets.CSC_LINK,本次安装包未签名。" >> $env:GITHUB_STEP_SUMMARY
          }

      - name: Install frontend dependencies
        run: npm ci

      - name: Install sidecar dependencies
        working-directory: apps/sidecar
        run: npm ci

      - name: Install desktop dependencies
        working-directory: apps/desktop
        run: npm ci

      - name: Type check
        run: npm run typecheck

      - name: Build sidecar
        working-directory: apps/sidecar
        run: npm run build

      - name: Build daemon (release binary)
        run: npm run build:daemon:release

      - name: Build renderer
        run: npm run build:renderer

      - name: Build unified web bundle
        run: npm run build:web

      - name: Package NSIS installer
        working-directory: apps/desktop
        # 不用根 build:electron-installer:它结尾的 pack:win 无法透传参数,而
        # electron-builder 默认策略是 onTagOrDraft —— 在 tag 触发的 CI 上会自行
        # 发布,和 ensure-release 建的 Release 打架。--publish never 让本 job 只出包,
        # 上传交给下一步统一做(可 --clobber 重跑)。
        run: npm run pack:win -- --publish never

      - name: Upload installer artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-installer-${{ needs.ensure-release.outputs.version }}
          # builder-debug.yml 是 electron-builder 的调试输出,不是发布物,别挂上去。
          path: |
            apps/desktop/release/*.exe
            apps/desktop/release/*.blockmap
            apps/desktop/release/latest.yml
            !apps/desktop/release/builder-*.yml
          if-no-files-found: error
          retention-days: 14

      - name: Publish assets to GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: kfumi/codeMUX
        run: |
          $assets = Get-ChildItem "apps/desktop/release" -File |
            Where-Object { $_.Extension -in ".exe", ".blockmap", ".yml" -and $_.Name -notlike "builder-*.yml" }
          if (-not $assets) {
            throw "apps/desktop/release 下没有可上传的安装包产物。"
          }
          $assets | ForEach-Object { Write-Host "上传: $($_.Name)" }
          gh release upload $env:TAG_NAME @($assets.FullName) --clobber
          Write-Host "已附加到 Release $env:TAG_NAME"
