name: Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  ensure-release:
    name: Ensure Release
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
      target_branch: ${{ steps.ensure.outputs.target_branch }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Resolve release version
        id: version
        shell: bash
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"

      - name: Ensure public release exists
        id: ensure
        uses: actions/github-script@v7
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
        with:
          github-token: ${{ github.token }}
          script: |
            const owner = "kfumi";
            const repo = "codeMUX";
            const tag = process.env.RELEASE_TAG;
            const version = process.env.RELEASE_VERSION;
            const repository = await github.rest.repos.get({ owner, repo });
            const targetBranch = repository.data.default_branch;
            core.info(`目标仓库默认分支: ${targetBranch}`);
            core.setOutput("target_branch", targetBranch);

            let releaseExists = false;

            try {
              const existing = await github.rest.repos.getReleaseByTag({
                owner,
                repo,
                tag,
              });
              releaseExists = true;
              core.info(`Release ${tag} 已存在，跳过创建。`);
              core.info(`Release id: ${existing.data.id}`);
            } catch (error) {
              if (error.status !== 404) {
                throw error;
              }

              let tagExists = true;
              try {
                await github.rest.git.getRef({
                  owner,
                  repo,
                  ref: `tags/${tag}`,
                });
                core.info(`Tag ${tag} 已存在，继续创建 Release。`);
              } catch (tagError) {
                if (tagError.status !== 404) {
                  throw tagError;
                }
                tagExists = false;
              }

              if (!tagExists) {
                const branchRef = await github.rest.git.getRef({
                  owner,
                  repo,
                  ref: `heads/${targetBranch}`,
                });

                await github.rest.git.createRef({
                  owner,
                  repo,
                  ref: `refs/tags/${tag}`,
                  sha: branchRef.data.object.sha,
                });

                core.info(`已创建 Tag ${tag} -> ${branchRef.data.object.sha}`);
              }

              const created = await github.rest.repos.createRelease({
                owner,
                repo,
                tag_name: tag,
                name: `codeMUX v${version}`,
                body: "桌面端安装包下载见下方 Assets。",
                draft: false,
                prerelease: false,
                target_commitish: targetBranch,
              });

              core.info(`已创建 Release ${tag}，id: ${created.data.id}`);
            }
