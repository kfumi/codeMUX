name: Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  ensure-release:
    name: Ensure Release
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
      target_branch: ${{ steps.ensure.outputs.target_branch }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Resolve release version
        id: version
        shell: bash
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"

      - name: Ensure public release exists
        id: ensure
        uses: actions/github-script@v7
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
        with:
          github-token: ${{ github.token }}
          script: |
            const owner = "kfumi";
            const repo = "codeMUX";
            const tag = process.env.RELEASE_TAG;
            const version = process.env.RELEASE_VERSION;
            const repository = await github.rest.repos.get({ owner, repo });
            const targetBranch = repository.data.default_branch;
            core.info(`目标仓库默认分支: ${targetBranch}`);
            core.setOutput("target_branch", targetBranch);

            let releaseExists = false;

            try {
              const existing = await github.rest.repos.getReleaseByTag({
                owner,
                repo,
                tag,
              });
              releaseExists = true;
              core.info(`Release ${tag} 已存在，跳过创建。`);
              core.info(`Release id: ${existing.data.id}`);
            } catch (error) {
              if (error.status !== 404) {
                throw error;
              }

              let tagExists = true;
              try {
                await github.rest.git.getRef({
                  owner,
                  repo,
                  ref: `tags/${tag}`,
                });
                core.info(`Tag ${tag} 已存在，继续创建 Release。`);
              } catch (tagError) {
                if (tagError.status !== 404) {
                  throw tagError;
                }
                tagExists = false;
              }

              if (!tagExists) {
                const branchRef = await github.rest.git.getRef({
                  owner,
                  repo,
                  ref: `heads/${targetBranch}`,
                });

                await github.rest.git.createRef({
                  owner,
                  repo,
                  ref: `refs/tags/${tag}`,
                  sha: branchRef.data.object.sha,
                });

                core.info(`已创建 Tag ${tag} -> ${branchRef.data.object.sha}`);
              }

              const created = await github.rest.repos.createRelease({
                owner,
                repo,
                tag_name: tag,
                name: `codeMUX v${version}`,
                body: "安装包见下方 Assets。\n\n| 平台 | 下载 | 说明 |\n| --- | --- | --- |\n| Windows | CodeMUX Setup *.exe | NSIS 安装包，双击安装 |\n| macOS (Apple Silicon) | CodeMUX *-arm64.dmg | 见下方「macOS 安装」 |\n| macOS (Intel) | CodeMUX *-x64.dmg | 见下方「macOS 安装」 |\n| Linux | CodeMUX *-x86_64.AppImage | chmod +x 后直接运行，无需安装 |\n\n## macOS 安装（未签名）\n\n本项目没有 Apple Developer ID 证书，因此 macOS 包是 ad-hoc 签名，**没有经过 Apple 公证**。首次打开会被 Gatekeeper 拦一次，这是 Apple 对所有未公证应用的统一策略，无法通过任何配置绕开。\n\n任选一种方式绕过：\n\n1. 打开 dmg，把 CodeMUX 拖进「应用程序」；然后**右键点 CodeMUX → 打开**，在弹窗里再点一次「打开」。\n2. 或在「终端」里执行：\n\n```bash\nxattr -dr com.apple.quarantine /Applications/CodeMUX.app\n```\n\n之后即可正常启动与自动更新。",
                draft: false,
                prerelease: false,
                target_commitish: targetBranch,
              });

              core.info(`已创建 Release ${tag}，id: ${created.data.id}`);
            }

  # Tauri 时代这里是 publish-tauri(tauri-action 一步出包并附到 Release)。
  # 迁移到 Electron 壳后该 job 被删掉,只剩 ensure-release 建记录、不出包 ——
  # 于是推 tag 只能得到一个空 Assets 的 Release。本 job 补回出包与上传。
  #
  # 三平台矩阵,而不是三份几乎一样的 job:pwsh 在 windows/ubuntu/macos runner 上
  # 都预装,所以「取产物 → 上传」这段 PowerShell 三个平台能原样共用;每个 runner
  # 只产自己平台的产物(electron-builder 只构建请求的 target),所以上传整个
  # release/ 目录、排除 builder-*.yml 即可,不必按平台写扩展名白名单。
  #
  # daemon 必须在本平台原生编译(Rust 无法从 Windows 交叉编译到 mac/linux),
  # 所以矩阵不能省,三个 runner 都要各自跑一遍完整构建。
  build-desktop:
    name: Build ${{ matrix.name }} Installer
    needs: ensure-release
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows
            os: windows-latest
            pack: win
          - name: macOS
            os: macos-latest
            pack: mac
          - name: Linux
            os: ubuntu-latest
            pack: linux
    env:
      TAG_NAME: ${{ needs.ensure-release.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          # 按 tag 而非触发 ref 取代码:workflow_dispatch 时 tag 可能刚由
          # ensure-release 创建,或与分支头有偏差,出包必须对齐 tag 指向的提交。
          ref: ${{ needs.ensure-release.outputs.tag }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            package-lock.json
            apps/sidecar/package-lock.json
            apps/desktop/package-lock.json

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: crates/daemon

      - name: Cache electron-builder binaries
        uses: actions/cache@v4
        with:
          # nsis / nsis-resources / 7zip / winCodeSign 等工具包约 100MB+,
          # 缓存后免去每次重新下载(国内网络下这步尤其容易超时)。三个平台的
          # 缓存目录不同,用 shell 变量拼(GitHub 表达式里取不到 LOCALAPPDATA 等)。
          path: |
            ~\AppData\Local\electron-builder\Cache
            ~/.cache/electron-builder
          key: electron-builder-${{ runner.os }}-${{ hashFiles('apps/desktop/package-lock.json') }}
          restore-keys: |
            electron-builder-${{ runner.os }}-

      - name: Install system dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          # 与 ci.yml 的 rust-check 同一套:openssl-sys 走系统 libssl,
          # sodiumoxide/libsqlite 需要 cc。
          sudo apt-get install -y build-essential libssl-dev pkg-config

      - name: Install system dependencies (macOS)
        if: runner.os == 'macOS'
        run: |
          # macos-latest 预装了 Homebrew 的 openssl@3,但 openssl-sys 不总能自己
          # 找到 brew 装的 openssl(它在 /opt/homebrew 而非 /usr/local),显式指一下。
          echo "OPENSSL_DIR=$(brew --prefix openssl@3 || brew --prefix openssl)" >> "$GITHUB_ENV"
          echo "PKG_CONFIG_PATH=$(brew --prefix openssl@3 || brew --prefix openssl)/lib/pkgconfig:$PKG_CONFIG_PATH" >> "$GITHUB_ENV"

      - name: Configure code signing
        shell: pwsh
        env:
          # secrets 上下文不能直接用于 if 条件,故先入环境变量再判断。
          CSC_LINK_SECRET: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD_SECRET: ${{ secrets.CSC_KEY_PASSWORD }}
        run: |
          if ($env:CSC_LINK_SECRET) {
            "CSC_LINK=$env:CSC_LINK_SECRET" >> $env:GITHUB_ENV
            "CSC_KEY_PASSWORD=$env:CSC_KEY_PASSWORD_SECRET" >> $env:GITHUB_ENV
            Write-Host "已注入签名证书,本次出包将签名(应用本体 + daemon)。"
          } else {
            Write-Host "未配置 secrets.CSC_LINK,本次出包为未签名产物。"
            "未配置 secrets.CSC_LINK,本次安装包未签名。" >> $env:GITHUB_STEP_SUMMARY
          }

      - name: Install frontend dependencies
        run: npm ci

      - name: Install sidecar dependencies
        working-directory: apps/sidecar
        run: npm ci

      - name: Install desktop dependencies
        working-directory: apps/desktop
        run: npm ci

      - name: Type check
        run: npm run typecheck

      - name: Build sidecar
        working-directory: apps/sidecar
        run: npm run build

      - name: Build daemon (release binary)
        run: npm run build:daemon:release

      - name: Build renderer
        run: npm run build:renderer

      - name: Build unified web bundle
        run: npm run build:web

      - name: Package installer
        working-directory: apps/desktop
        # pack:* 里已固定 --publish never:electron-builder 默认策略是 onTagOrDraft,
        # 在 tag 触发的 CI 上会自行发布并和 ensure-release 建的 Release 打架。
        # 上传统一交给下一步(gh release upload --clobber,可重跑)。
        shell: bash
        # pipefail:不设的话管道会以 tee 的退出码为准,打包失败会被吞掉。
        # 显式用 bash(Windows runner 上是 Git Bash),三个平台同一份。
        run: |
          set -o pipefail
          npm run pack:${{ matrix.pack }} 2>&1 | tee packaging.log

      # 把产物收敛到一个干净目录再上传/附加。直接对 release/ 写 glob 有两个坑:
      #   1) 多架构时 electron-builder 会把文件放进 release/<target>/ 子目录,顶层 glob 抓不到;
      #   2) 用 ** 递归又会把 win-unpacked 之类解包目录(几百 MB)一并传上去。
      # 所以按扩展名白名单挑,并排除 builder-* 调试输出和解包目录内的 resources/。
      - name: Collect release assets
        if: always()
        shell: pwsh
        run: |
          # 无论成败都把打包日志尾部打进 annotations。::warning:: 不会让 job 失败,
          # 但内容可经 GitHub API 读到 —— 排查时不必去翻需要鉴权的原始日志。
          if (Test-Path "apps/desktop/packaging.log") {
            $tail = (Get-Content "apps/desktop/packaging.log" -Tail 30) -join " / "
            "::warning title=打包日志尾部::$tail" | Out-Null
          }

          $dest = Join-Path $env:GITHUB_WORKSPACE "release-assets"
          New-Item -ItemType Directory -Force -Path $dest | Out-Null
          # 排除三样东西:
          #   builder-*       electron-builder 调试输出
          #   app-update.yml  打包期生成的更新配置,不是发布物
          #   *-unpacked / *.app / resources  解包目录(v0.4.3 曾误收
          #                 win-unpacked/CodeMUX.exe,180MB 纯垃圾)
          $assets = Get-ChildItem "apps/desktop/release" -Recurse -File |
            Where-Object {
              $_.Name -notlike "builder-*" -and
              $_.Name -ne "app-update.yml" -and
              $_.FullName -notmatch "\\(win-unpacked|linux-unpacked|[^\\]+\.app|resources)\\" -and
              $_.Extension -in ".exe", ".dmg", ".zip", ".AppImage", ".blockmap", ".yml"
            }
          "::warning title=收集到的产物::$($assets.Count) 个: $(($assets.Name) -join ' / ')" | Out-Null
          if (-not $assets) {
            "::error title=没有出包产物::apps/desktop/release 下没有可上传的安装包文件" | Out-Null
            "::error title=release 目录现状::$((Get-ChildItem apps/desktop/release -Recurse -Depth 2 | Select-Object -First 30 -ExpandProperty FullName) -join ' / ')" | Out-Null
            exit 1
          }
          $assets | ForEach-Object {
            Write-Host "收集: $($_.Name)"
            Copy-Item $_.FullName -Destination $dest
          }
          Write-Host "共收集 $($assets.Count) 个文件到 release-assets"

      - name: Upload installer artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.pack }}-installer-${{ needs.ensure-release.outputs.version }}
          path: release-assets/*
          if-no-files-found: error
          retention-days: 14

      - name: Publish assets to GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: kfumi/codeMUX
        run: |
          $assets = Get-ChildItem "release-assets" -File
          if (-not $assets) {
            throw "release-assets 下没有可上传的安装包产物。"
          }
          $assets | ForEach-Object { Write-Host "上传: $($_.Name)" }
          gh release upload $env:TAG_NAME @($assets.FullName) --clobber
          Write-Host "已附加到 Release $env:TAG_NAME"
