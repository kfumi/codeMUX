name: Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  ensure-release:
    name: Ensure Release
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
      target_branch: ${{ steps.ensure.outputs.target_branch }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Resolve release version
        id: version
        shell: bash
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"

      - name: Ensure public release exists
        id: ensure
        uses: actions/github-script@v7
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
        with:
          github-token: ${{ github.token }}
          script: |
            const owner = "kfumi";
            const repo = "codeMUX";
            const tag = process.env.RELEASE_TAG;
            const version = process.env.RELEASE_VERSION;
            const repository = await github.rest.repos.get({ owner, repo });
            const targetBranch = repository.data.default_branch;
            core.info(`目标仓库默认分支: ${targetBranch}`);
            core.setOutput("target_branch", targetBranch);

            let releaseExists = false;

            try {
              const existing = await github.rest.repos.getReleaseByTag({
                owner,
                repo,
                tag,
              });
              releaseExists = true;
              core.info(`Release ${tag} 已存在，跳过创建。`);
              core.info(`Release id: ${existing.data.id}`);
            } catch (error) {
              if (error.status !== 404) {
                throw error;
              }

              let tagExists = true;
              try {
                await github.rest.git.getRef({
                  owner,
                  repo,
                  ref: `tags/${tag}`,
                });
                core.info(`Tag ${tag} 已存在，继续创建 Release。`);
              } catch (tagError) {
                if (tagError.status !== 404) {
                  throw tagError;
                }
                tagExists = false;
              }

              if (!tagExists) {
                const branchRef = await github.rest.git.getRef({
                  owner,
                  repo,
                  ref: `heads/${targetBranch}`,
                });

                await github.rest.git.createRef({
                  owner,
                  repo,
                  ref: `refs/tags/${tag}`,
                  sha: branchRef.data.object.sha,
                });

                core.info(`已创建 Tag ${tag} -> ${branchRef.data.object.sha}`);
              }

              const created = await github.rest.repos.createRelease({
                owner,
                repo,
                tag_name: tag,
                name: `codeMUX v${version}`,
                body: "桌面端安装包下载见下方 Assets。",
                draft: false,
                prerelease: false,
                target_commitish: targetBranch,
              });

              core.info(`已创建 Release ${tag}，id: ${created.data.id}`);
            }

  publish-tauri:
    needs: ensure-release
    name: Publish (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install system dependencies (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential \
            libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev patchelf

      - name: Install frontend dependencies
        run: npm ci

      - name: Install sidecar dependencies
        working-directory: src-tauri/sidecar
        run: npm ci

      - name: Build sidecar
        working-directory: src-tauri/sidecar
        run: npm run build

      - name: Build and publish Tauri app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ github.token }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          owner: kfumi
          repo: codeMUX
          tagName: ${{ needs.ensure-release.outputs.tag }}
          releaseName: "codeMUX v${{ needs.ensure-release.outputs.version }}"
          releaseBody: "桌面端安装包下载见下方 Assets。"
          releaseDraft: false
          prerelease: false
          releaseCommitish: ${{ needs.ensure-release.outputs.target_branch }}

  publish-runtime-packs:
    needs: ensure-release
    name: Publish Runtime Packs (windows-x64)
    runs-on: windows-latest

    strategy:
      fail-fast: false
      matrix:
        provider: [claude_code, codex, opencode]

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install sidecar dependencies
        working-directory: src-tauri/sidecar
        run: npm ci

      - name: Resolve SDK versions
        id: sdk-version
        shell: bash
        run: |
          case "${{ matrix.provider }}" in
            claude_code) VERSION=$(node -p "require('./src-tauri/sidecar/node_modules/@anthropic-ai/claude-agent-sdk/package.json').version") ;;
            codex) VERSION=$(node -p "require('./src-tauri/sidecar/node_modules/@openai/codex-sdk/package.json').version") ;;
            opencode) VERSION=$(node -p "require('./src-tauri/sidecar/node_modules/@opencode-ai/sdk/package.json').version") ;;
          esac
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "已解析 ${{ matrix.provider }} SDK 版本: $VERSION"

      - name: Write signing key (if available)
        if: ${{ secrets.CODEMUX_RUNTIME_SIGNING_KEY != '' }}
        shell: bash
        run: |
          printf '%s' '${{ secrets.CODEMUX_RUNTIME_SIGNING_KEY }}' > $RUNNER_TEMP/runtime-signing-key.pem

      - name: Build Runtime Pack
        shell: bash
        run: |
          SIGNING_ARGS=""
          if [ -f "$RUNNER_TEMP/runtime-signing-key.pem" ]; then
            SIGNING_ARGS="--signing-key $RUNNER_TEMP/runtime-signing-key.pem"
          fi
          node scripts/build-runtime-pack.mjs \
            ${{ matrix.provider }} \
            ${{ steps.sdk-version.outputs.version }} \
            --platform windows \
            --arch x64 \
            --sidecar-compat ">=0.2.0" \
            $SIGNING_ARGS

      - name: Upload Runtime Pack to Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.ensure-release.outputs.tag }}
          files: |
            dist/runtime-packs/*.tar.gz
            dist/runtime-packs/*.manifest.json
        env:
          GITHUB_TOKEN: ${{ github.token }}
